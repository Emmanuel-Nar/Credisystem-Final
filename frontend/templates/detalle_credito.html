{% extends "base.html" %}
{% block title %}Detalle de crédito — CREDISYSTEM{% endblock %}
{% block content %}
<div class="app-shell wide"><div class="page-head"><span class="kicker">Crédito #<span id="creditoIdLabel">—</span></span><h1>Detalle del crédito</h1></div><div class="alert alert-error" id="alertaError" style="display:none;"></div><div class="alert alert-success" id="alertaExito" style="display:none;"></div><div class="panel" id="resumenPanel"><div class="skeleton" style="height:150px;"></div></div><div class="panel" style="margin-top:24px;"><div class="panel-head"><div><h2>Historial de pagos</h2><p id="pagosResumen"></p></div><button type="button" class="btn btn-solid btn-sm" id="btnPagar" style="display:none;">Pagar saldo pendiente</button></div><div id="pagosWrap"><div class="skeleton" style="height:55px;margin-bottom:10px;"></div><div class="skeleton" style="height:55px;"></div></div></div></div>
{% endblock %}
{% block extra_js %}
<script>
requireAuth();const partes=window.location.pathname.split('/').filter(Boolean);const creditoId=partes[partes.indexOf('creditos')+1]||partes[partes.length-1];document.getElementById('creditoIdLabel').textContent=creditoId;
function estadoABadge(e){e=(e||'').toLowerCase();if(e==='activo'||e==='aprobado')return'green';if(e==='en_mora'||e==='rechazado')return'red';return'gray';}
function fechaAR(f){return f?new Date(f).toLocaleDateString('es-AR'):'—';}
async function pagarSaldo(){const btn=document.getElementById('btnPagar');const err=document.getElementById('alertaError');const ok=document.getElementById('alertaExito');err.style.display='none';ok.style.display='none';btn.disabled=true;btn.textContent='Generando pago…';try{const credito=await API.detalleCredito(creditoId);const pref=await API.crearPreferenciaPago(creditoId,credito.saldo_pendiente,true);if(pref.init_point)window.location.href=pref.init_point;else{ok.textContent='Se generó el pago correctamente.';ok.style.display='flex';}}catch(e){mostrarErrorEnAlerta('alertaError',e);}finally{btn.disabled=false;btn.textContent='Pagar saldo pendiente';}}
document.getElementById('btnPagar').addEventListener('click',pagarSaldo);
(async()=>{try{const credito=await API.detalleCredito(creditoId);document.getElementById('resumenPanel').innerHTML=`<div class="balance-panel" style="margin-bottom:20px;"><div class="label">Saldo pendiente</div><div class="amount">${formatoARS(credito.saldo_pendiente)}</div><div class="sub">Crédito #${credito.id_credito} · ${credito.plazo_meses} meses</div></div><div class="credit-summary-grid"><div><span style="color:var(--text-muted);font-size:.86rem;">Monto original</span><br><b>${formatoARS(credito.monto_original)}</b></div><div><span style="color:var(--text-muted);font-size:.86rem;">Tasa anual</span><br><b>${credito.tasa_interes_anual}%</b></div><div><span style="color:var(--text-muted);font-size:.86rem;">Fecha de otorgamiento</span><br><b>${fechaAR(credito.fecha_otorgamiento)}</b></div><div><span style="color:var(--text-muted);font-size:.86rem;">Próximo vencimiento</span><br><b>${fechaAR(credito.proximo_vencimiento)}</b></div><div><span style="color:var(--text-muted);font-size:.86rem;">Cuotas pendientes (estimadas)</span><br><b>${credito.cuotas_pendientes}</b></div><div><span style="color:var(--text-muted);font-size:.86rem;">Estado</span><br><span class="badge badge-${estadoABadge(credito.estado)}">${credito.estado||'—'}</span></div></div>`;if(Number(credito.saldo_pendiente)>0&&credito.estado==='activo'){document.getElementById('btnPagar').style.display='inline-flex';}const pagos=Array.isArray(credito.historial_pagos)?credito.historial_pagos:[];document.getElementById('pagosResumen').textContent=`${pagos.length} pago${pagos.length===1?'':'s'} registrado${pagos.length===1?'':'s'}`;const wrap=document.getElementById('pagosWrap');if(!pagos.length){wrap.innerHTML='<div class="empty-state"><p>Todavía no hay pagos registrados.</p></div>';return;}wrap.innerHTML=`<table class="list-table"><thead><tr><th>Fecha</th><th>Monto</th><th>Medio</th><th>Estado</th></tr></thead><tbody>${pagos.map(p=>`<tr><td>${p.fecha_pago?new Date(p.fecha_pago).toLocaleDateString('es-AR'):'—'}</td><td>${formatoARS(p.monto_pagado)}</td><td>${p.medio_pago||'—'}</td><td><span class="badge badge-${p.resultado==='aprobado'?'green':p.resultado==='rechazado'?'red':'gray'}">${p.resultado||'—'}</span></td></tr>`).join('')}</tbody></table>`;}catch(err){mostrarErrorEnAlerta('alertaError',err);document.getElementById('resumenPanel').innerHTML='<div class="empty-state"><p>No pudimos cargar este crédito.</p></div>';document.getElementById('pagosWrap').innerHTML='';}})();
</script>
{% endblock %}
