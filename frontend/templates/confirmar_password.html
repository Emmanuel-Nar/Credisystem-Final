{% extends "base.html" %}
{% block title %}Nueva contraseña — CREDISYSTEM{% endblock %}
{% block content %}<div class="auth-wrap"><div class="auth-card"><span class="eyebrow">Recuperación</span><h1>Nueva contraseña</h1><p class="sub">Ingresá el código recibido y elegí una nueva contraseña.</p><div class="alert alert-error" id="alertaError" style="display:none;"></div><div class="alert alert-success" id="alertaExito" style="display:none;"></div><form id="formConfirmar"><div class="field"><label for="email">Email</label><input class="input" type="email" id="email" required></div><div class="field"><label for="codigo">Código de 6 dígitos</label><input class="input" type="text" id="codigo" maxlength="6" inputmode="numeric" required></div><div class="field"><label for="passwordNueva">Nueva contraseña</label><input class="input" type="password" id="passwordNueva" minlength="8" required></div><div class="field"><label for="passwordNueva2">Repetir contraseña</label><input class="input" type="password" id="passwordNueva2" minlength="8" required></div><button class="btn btn-solid btn-block" id="btnConfirmar" type="submit"><span id="btnText">Cambiar contraseña</span></button></form></div></div>{% endblock %}
{% block extra_js %}<script>const params=new URLSearchParams(location.search);const uid=params.get('uid')||'',token=params.get('token')||'';document.getElementById('email').value=params.get('email')||'';if(uid&&token){document.getElementById('email').closest('.field').style.display='none';document.getElementById('codigo').closest('.field').style.display='none';document.getElementById('email').required=false;document.getElementById('codigo').required=false;}const form=document.getElementById('formConfirmar'),btn=document.getElementById('btnConfirmar'),txt=document.getElementById('btnText'),err=document.getElementById('alertaError'),ok=document.getElementById('alertaExito');form.addEventListener('submit',async e=>{e.preventDefault();err.style.display='none';ok.style.display='none';const email=document.getElementById('email').value.trim(),codigo=document.getElementById('codigo').value.trim(),p1=document.getElementById('passwordNueva').value,p2=document.getElementById('passwordNueva2').value;if(p1!==p2){err.textContent='Las contraseñas no coinciden.';err.style.display='flex';return;}btn.disabled=true;txt.innerHTML='<span class="spinner"></span>';try{await API.confirmarRecuperacion(email,codigo,p1,p2,uid,token);ok.textContent='Contraseña actualizada. Redirigiendo al login…';ok.style.display='flex';setTimeout(()=>location.href="{% url 'login' %}",1400);}catch(x){mostrarErrorEnAlerta('alertaError',x);}finally{btn.disabled=false;txt.textContent='Cambiar contraseña';}});</script>{% endblock %}
