{% extends "base.html" %}
{% block title %}Recuperar contraseña — CREDISYSTEM{% endblock %}
{% block content %}<div class="auth-wrap"><div class="auth-card"><span class="eyebrow">Recuperación</span><h1>Recuperá tu contraseña</h1><p class="sub">Ingresá tu email y te enviaremos un código de recuperación.</p><div class="alert alert-error" id="alertaError" style="display:none;"></div><div class="alert alert-success" id="alertaExito" style="display:none;"></div><form id="formRecuperar"><div class="field"><label for="email">Email</label><input class="input" type="email" id="email" required autocomplete="email"></div><button class="btn btn-solid btn-block" id="btnEnviar" type="submit"><span id="btnText">Enviar código</span></button></form><div class="auth-foot"><a href="{% url 'login' %}">Volver al inicio de sesión</a></div></div></div>{% endblock %}
{% block extra_js %}<script>const form=document.getElementById('formRecuperar'),btn=document.getElementById('btnEnviar'),txt=document.getElementById('btnText'),err=document.getElementById('alertaError'),ok=document.getElementById('alertaExito');form.addEventListener('submit',async e=>{e.preventDefault();err.style.display='none';ok.style.display='none';const email=document.getElementById('email').value.trim();btn.disabled=true;txt.innerHTML='<span class="spinner"></span>';try{const respuesta=await API.solicitarRecuperacion(email);ok.textContent=respuesta.detail;ok.style.display='flex';setTimeout(()=>window.location.href="{% url 'confirmar_password' %}?email="+encodeURIComponent(email),1000);}catch(x){mostrarErrorEnAlerta('alertaError',x);}finally{btn.disabled=false;txt.textContent='Enviar código';}});</script>{% endblock %}
